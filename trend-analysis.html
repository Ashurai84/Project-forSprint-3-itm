<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Analysis - Social Setu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #7c3aed;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --background: #ffffff;
            --surface: #f9fafb;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--surface);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Top Navigation */
        .top-nav {
            background: var(--background);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.25rem;
        }

        .brand-logo {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 1rem;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-link:hover {
            color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        .nav-link.active {
            color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
        }

        /* Main Container */
        .trends-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .page-header {
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Filter Section */
        .filter-section {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .filter-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .filter-select {
            padding: 0.5rem 1rem;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .filter-select:hover,
        .filter-select:focus {
            border-color: var(--primary);
            outline: none;
        }

        .refresh-btn {
            padding: 0.5rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .refresh-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        /* Trending Topics Grid */
        .trending-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .trend-card {
            background: var(--background);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .trend-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .trend-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .trend-rank {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.875rem;
        }

        .trend-growth {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .trend-growth.up {
            color: var(--success);
        }

        .trend-growth.down {
            color: var(--error);
        }

        .trend-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .trend-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .trend-tag {
            background: var(--surface);
            color: var(--text-secondary);
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.875rem;
            border: 1px solid var(--border);
        }

        .trend-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .trend-stat {
            text-align: center;
        }

        .stat-value {
            display: block;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.125rem;
        }

        .stat-label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Generate Button */
        .generate-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15);
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: none;
            animation: slideIn 0.3s ease;
        }

        .notification.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="top-nav">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand">
                <span class="brand-logo">Social Setu</span>
            </a>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="content-creator.html" class="nav-link">Content</a></li>
                <li><a href="schedule-manager.html" class="nav-link">Schedule</a></li>
                <li><a href="analytics-insights.html" class="nav-link">Analytics</a></li>
                <li><a href="trend-analysis.html" class="nav-link active">Trends</a></li>
                <li><a href="support-chat.html" class="nav-link">Support</a></li>
                <li><a href="pricing.html" class="nav-link">Pricing</a></li>
                <li><a href="#" onclick="logout()" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="trends-container">
        <!-- Header -->
        <div class="page-header">
            <h1 class="page-title">Trend Analysis</h1>
            <p class="page-subtitle">Discover what's trending in your industry and get content ideas</p>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-group">
                <label class="filter-label">Industry:</label>
                <select class="filter-select" id="industryFilter">
                    <option>Technology</option>
                    <option>Marketing</option>
                    <option>Finance</option>
                    <option>Healthcare</option>
                    <option>Education</option>
                    <option>E-commerce</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Platform:</label>
                <select class="filter-select" id="platformFilter">
                    <option>All Platforms</option>
                    <option>Instagram</option>
                    <option>Twitter</option>
                    <option>LinkedIn</option>
                    <option>TikTok</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Time Range:</label>
                <select class="filter-select" id="timeFilter">
                    <option>Last 24 Hours</option>
                    <option>Last 7 Days</option>
                    <option>Last 30 Days</option>
                </select>
            </div>
            <button class="refresh-btn" onclick="refreshTrends()">
                <span>🔄</span>
                <span>Refresh</span>
            </button>
        </div>

        <!-- Trending Topics -->
        <div class="trending-grid" id="trendingGrid">
            <!-- Trends will be populated by JavaScript -->
        </div>
    </div>

    <!-- Generate Ideas Button -->
    <button class="generate-btn" onclick="generateIdeas()">
        <span>✨</span>
        <span>Generate Ideas</span>
    </button>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <script src="js/gemini.js"></script>
    <script>
        // Initialize with dummy data
        const trendData = {
            technology: [
                {rank: 1, title: '#AIRevolution', growth: 234, tags: ['Technology', 'Innovation', 'Future'], posts: '125K', engagement: '3.2M'},
                {rank: 2, title: '#CloudComputing', growth: 156, tags: ['Tech', 'Infrastructure', 'SaaS'], posts: '89K', engagement: '2.1M'},
                {rank: 3, title: '#CyberSecurity', growth: 98, tags: ['Security', 'Privacy', 'Tech'], posts: '67K', engagement: '1.8M'},
                {rank: 4, title: '#Web3', growth: 76, tags: ['Blockchain', 'Crypto', 'DeFi'], posts: '45K', engagement: '1.2M'},
                {rank: 5, title: '#MachineLearning', growth: -12, tags: ['AI', 'Data', 'Analytics'], posts: '38K', engagement: '980K'},
                {rank: 6, title: '#DevOps', growth: 45, tags: ['Development', 'Operations', 'CI/CD'], posts: '32K', engagement: '756K'}
            ],
            marketing: [
                {rank: 1, title: '#ContentMarketing', growth: 189, tags: ['Content', 'Strategy', 'Branding'], posts: '145K', engagement: '4.1M'},
                {rank: 2, title: '#InfluencerMarketing', growth: 123, tags: ['Influencers', 'Social', 'Campaigns'], posts: '98K', engagement: '2.8M'},
                {rank: 3, title: '#SEO', growth: 87, tags: ['Search', 'Optimization', 'Google'], posts: '76K', engagement: '2.2M'},
                {rank: 4, title: '#SocialMedia', growth: 65, tags: ['Social', 'Engagement', 'Community'], posts: '54K', engagement: '1.6M'},
                {rank: 5, title: '#EmailMarketing', growth: -8, tags: ['Email', 'Automation', 'Conversion'], posts: '41K', engagement: '1.1M'},
                {rank: 6, title: '#VideoMarketing', growth: 234, tags: ['Video', 'Content', 'Engagement'], posts: '35K', engagement: '890K'}
            ]
        };

        let currentTrends = trendData.technology;

        function displayTrends() {
            const grid = document.getElementById('trendingGrid');
            grid.innerHTML = currentTrends.map(trend => `
                <div class="trend-card">
                    <div class="trend-header">
                        <span class="trend-rank">${trend.rank}</span>
                        <span class="trend-growth ${trend.growth > 0 ? 'up' : 'down'}">
                            ${trend.growth > 0 ? '↑' : '↓'} ${Math.abs(trend.growth)}%
                        </span>
                    </div>
                    <h3 class="trend-title">${trend.title}</h3>
                    <div class="trend-tags">
                        ${trend.tags.map(tag => `<span class="trend-tag">${tag}</span>`).join('')}
                    </div>
                    <div class="trend-stats">
                        <div class="trend-stat">
                            <span class="stat-value">${trend.posts}</span>
                            <span class="stat-label">Posts</span>
                        </div>
                        <div class="trend-stat">
                            <span class="stat-value">${trend.engagement}</span>
                            <span class="stat-label">Engagement</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function refreshTrends() {
            const industry = document.getElementById('industryFilter').value.toLowerCase();
            const notification = document.getElementById('notification');
            
            // Simulate loading
            const grid = document.getElementById('trendingGrid');
            grid.style.opacity = '0.5';
            
            setTimeout(() => {
                // Update trends based on industry
                if (industry === 'technology') {
                    currentTrends = trendData.technology;
                } else if (industry === 'marketing') {
                    currentTrends = trendData.marketing;
                } else {
                    // Randomize data for other industries
                    currentTrends = trendData.technology.map(t => ({
                        ...t,
                        growth: Math.floor(Math.random() * 300) - 50,
                        posts: Math.floor(Math.random() * 200) + 'K',
                        engagement: (Math.random() * 5).toFixed(1) + 'M'
                    }));
                }
                
                displayTrends();
                grid.style.opacity = '1';
                
                // Show notification
                notification.textContent = '✅ Trends refreshed successfully!';
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }, 500);
        }

        async function generateIdeas() {
            const industry = document.getElementById('industryFilter').value;
            const platform = document.getElementById('platformFilter').value;
            const notification = document.getElementById('notification');
            
            // Show loading notification
            notification.textContent = '⏳ Generating content ideas...';
            notification.classList.add('show');
            
            try {
                // Check if Gemini AI is available
                if (typeof GeminiAI !== 'undefined') {
                    const geminiAI = new GeminiAI();
                    const prompt = `Generate 5 creative content ideas for ${industry} industry on ${platform}. Format as a simple list.`;
                    const ideas = await geminiAI.callGemini(prompt);
                    
                    notification.textContent = '✅ Ideas generated! Check Content Creator.';
                    notification.classList.add('show');
                    
                    // Store ideas in localStorage
                    localStorage.setItem('generatedIdeas', ideas);
                    
                    // Redirect to content creator after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'content-creator.html';
                    }, 2000);
                } else {
                    // Fallback to dummy ideas
                    const dummyIdeas = [
                        `Behind-the-scenes of ${industry} innovation`,
                        `Top 10 trends in ${industry} for 2025`,
                        `How AI is transforming ${industry}`,
                        `Success stories from ${industry} leaders`,
                        `Future predictions for ${industry}`
                    ];
                    
                    notification.textContent = '✅ Ideas generated! Check Content Creator.';
                    localStorage.setItem('generatedIdeas', JSON.stringify(dummyIdeas));
                    
                    setTimeout(() => {
                        window.location.href = 'content-creator.html';
                    }, 2000);
                }
            } catch (error) {
                console.error('Error generating ideas:', error);
                notification.textContent = '❌ Error generating ideas. Please try again.';
                notification.style.background = 'var(--error)';
                
                setTimeout(() => {
                    notification.classList.remove('show');
                    notification.style.background = 'var(--success)';
                }, 3000);
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = 'index.html';
            }
        }

        // Filter change handlers
        document.getElementById('industryFilter').addEventListener('change', refreshTrends);
        document.getElementById('platformFilter').addEventListener('change', () => {
            const notification = document.getElementById('notification');
            notification.textContent = '✅ Platform filter updated!';
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 2000);
        });
        document.getElementById('timeFilter').addEventListener('change', refreshTrends);

        // Initialize on load
        displayTrends();
    </script>
</body>
</html>
